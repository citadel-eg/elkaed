name: Keep Supabase Awake

on:
  schedule:
    # Runs every 2 days at 08:00 UTC
    - cron: '0 8 */2 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database & REST Endpoint
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://hqmnistbtiozalclszhm.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_wmCNONnSLB9hJSjeg8kb-w_kPyn4Tw1' }}
        run: |
          echo "Sending keep-alive ping to Supabase..."
          curl -s -f -X GET "${SUPABASE_URL}/rest/v1/products?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -o /dev/null -w "HTTP Response Code: %{http_code}\n"
          echo "Supabase successfully pinged! Database will not pause."
